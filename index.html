<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秦的个人主页</title>
    <style>
        /* 下面是 CSS 样式，用来让网页变好看 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            text-align: center;
            padding: 50px;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* 变成圆形 */
            object-fit: cover;
            border: 3px solid #4CAF50;
        }
        h1 { color: #4CAF50; }
        .skills { background: white; padding: 20px; border-radius: 8px; display: inline-block; margin-top: 20px;}
        .project { background: white; margin: 20px auto; padding: 20px; border-radius: 8px; max-width: 500px; text-align: left;}
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- 1. 头部 -->
    <img src="image\1.jpg" alt="我的头像" class="profile-pic">
    <h1>你好，我是秦</h1>
    <p>一名正在努力学习编程的大学生 </p>
</body>
</html>
